<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Michael Sumin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M0 0h24l8 8v24H0z' fill='%230a0a0a'/%3E%3Cpath d='M9 8h14v4H9zM10 14h12v4H10zM11 20h10v4H11z' fill='%23ff2a2a'/%3E%3Cpath d='M24 0l8 8h-8z' fill='%23ffe600'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Rajdhani:wght@600;700&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<!-- GitHub Pages serves this page at whatever address was mistyped, so it
     carries its own styles instead of linking assets/styles.css by a
     relative path that would break. -->
<style>
  :root { color-scheme: dark; --bg: #0a0a0a; --ink: #f2f0eb; --ink-2: #c4c2bd; --muted: #8a8884; --accent: #ff2a2a; --yellow: #ffe600; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font-family: "Schibsted Grotesk", system-ui, sans-serif; line-height: 1.6;
    padding: 32px 16px;
  }
  main { display: flex; gap: clamp(28px, 6vw, 64px); align-items: center; flex-wrap: wrap; justify-content: center; max-width: 900px; }
  svg { width: clamp(120px, 22vw, 200px); height: auto; flex: none; }
  .label { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-family: "Rajdhani", system-ui, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: .95; font-size: clamp(48px, 9vw, 96px); margin: 10px 0 16px; }
  p { color: var(--ink-2); max-width: 40ch; margin: 0 0 28px; }
  a.btn {
    display: inline-flex; padding: 11px 20px; background: var(--accent); color: var(--bg); text-decoration: none;
    font-family: "Rajdhani", system-ui, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .08em; text-transform: uppercase;
    clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
  }
  a.btn:hover { background: var(--ink); }
  a.btn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <!-- The site's yellow crosshair, locked on nothing. -->
  <svg viewBox="0 0 200 200" fill="none" stroke="#ffe600" aria-hidden="true">
    <circle cx="100" cy="100" r="44" stroke-width="6" stroke-dasharray="150 18 60 48" transform="rotate(-70 100 100)"/>
    <path stroke-width="3" d="M104 0v74M104 126v74M0 98h64M136 98h40M184 98h16"/><path stroke-width="8" d="M150 98h14"/>
  </svg>
  <div>
    <p class="label">Error 404 // Read failed</p>
    <h1>Page not found</h1>
    <p>This page doesn't exist, or the link broke on the way here.</p>
    <!-- EDIT: if the site lives at a sub-path (username.github.io/portfolio/),
         change this href to that path, for example "/portfolio/". -->
    <a class="btn" href="/">Back to the projects</a>
  </div>
</main>
</body>
</html>
